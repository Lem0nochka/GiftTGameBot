<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1621" />
  <meta name="color-scheme" content="dark light" />
  <title>GiftRadar</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
    :root {
      --bg: #0b1119;
      --panel: rgba(22, 31, 43, .78);
      --panel-strong: #151f2c;
      --stroke: rgba(255,255,255,.07);
      --text: #f4f7fb;
      --muted: #93a1b3;
      --blue: #2ea8ff;
      --blue2: #1677ff;
      --green: #44d483;
      --gold: #ffcb66;
      --danger: #ff6b6b;
      --shadow: 0 18px 55px rgba(0,0,0,.24);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow-x: hidden; }
    button, input, select { font: inherit; }
    button { border: 0; color: inherit; }

    .app { min-height: 100vh; padding: calc(12px + var(--safe-top)) 12px calc(88px + var(--safe-bottom)); }
    .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .ambient::before, .ambient::after { content:""; position:absolute; width: 320px; height:320px; border-radius:50%; filter: blur(65px); opacity:.16; animation: drift 9s ease-in-out infinite alternate; }
    .ambient::before { background:#1588ff; top:-120px; left:-100px; }
    .ambient::after { background:#7c54ff; bottom:-140px; right:-100px; animation-delay:-3s; }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(28px,18px,0) scale(1.1); } }
    .content { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; }

    .hero { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .radar-logo { width:44px; height:44px; border-radius:15px; position:relative; overflow:hidden; background: radial-gradient(circle at center, #5bc1ff 0 4px, transparent 5px), conic-gradient(from 20deg, rgba(72,180,255,.95), rgba(52,104,255,.14), rgba(74,214,157,.5), rgba(49,122,255,.95)); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 10px 30px rgba(36,142,255,.24); }
    .radar-logo::before { content:""; position:absolute; inset:6px; border:1px solid rgba(255,255,255,.28); border-radius:50%; }
    .radar-logo::after { content:""; position:absolute; left:50%; top:50%; width:34px; height:1px; background:rgba(255,255,255,.65); transform-origin:left center; animation:sweep 2.3s linear infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .title { font-size: 20px; font-weight: 800; letter-spacing: -.3px; }
    .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .live-pill { display:flex; align-items:center; gap:7px; padding:8px 10px; border-radius:999px; background:rgba(68,212,131,.09); border:1px solid rgba(68,212,131,.16); font-size:12px; color:#c7f7dc; white-space:nowrap; }
    .dot { width:7px; height:7px; background:var(--green); border-radius:50%; box-shadow:0 0 0 5px rgba(68,212,131,.08); animation:pulse 1.8s infinite; }
    @keyframes pulse { 50% { transform:scale(.72); opacity:.65; } }

    .search { background:var(--panel); backdrop-filter: blur(18px); border:1px solid var(--stroke); border-radius:18px; padding:10px; box-shadow:var(--shadow); display:flex; gap:8px; margin-bottom:10px; }
    .search input { flex:1; min-width:0; background:rgba(255,255,255,.05); color:var(--text); border:1px solid rgba(255,255,255,.06); border-radius:13px; outline:none; padding:12px 13px; }
    .search input:focus { border-color:rgba(46,168,255,.55); box-shadow:0 0 0 3px rgba(46,168,255,.11); }
    .icon-btn { width:44px; border-radius:13px; background:#1b2939; cursor:pointer; }

    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
    .stat { min-height:68px; padding:12px; border-radius:17px; background:var(--panel); backdrop-filter:blur(18px); border:1px solid var(--stroke); box-shadow:var(--shadow); }
    .stat .v { font-size:20px; font-weight:800; }
    .stat .l { font-size:11px; color:var(--muted); margin-top:4px; }

    .controls { display:flex; gap:7px; overflow:auto; padding:1px 0 4px; scrollbar-width:none; margin-bottom:7px; }
    .controls::-webkit-scrollbar { display:none; }
    .chip { flex:0 0 auto; padding:9px 12px; border-radius:999px; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.06); color:#b8c4d2; cursor:pointer; transition:.18s ease; font-size:12px; }
    .chip.active { background:rgba(46,168,255,.12); border-color:rgba(46,168,255,.35); color:#dff3ff; transform:translateY(-1px); }

    .hint { display:flex; align-items:flex-start; gap:8px; padding:10px 11px; color:#aab5c3; font-size:11px; line-height:1.35; background:rgba(255,203,102,.05); border:1px solid rgba(255,203,102,.1); border-radius:14px; margin:5px 0 10px; }

    .section-head { display:flex; align-items:center; justify-content:space-between; margin:14px 2px 8px; }
    .section-head h2 { font-size:15px; margin:0; }
    .section-head span { font-size:11px; color:var(--muted); }

    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .card { background:linear-gradient(180deg, rgba(23,32,44,.95), rgba(18,26,36,.94)); border:1px solid rgba(255,255,255,.07); border-radius:20px; overflow:hidden; box-shadow:var(--shadow); transform:translateZ(0); animation:rise .35s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px) scale(.985); } to { opacity:1; transform:none; } }
    .card-img-wrap { position:relative; aspect-ratio:1/1; background:linear-gradient(135deg,#17243a,#111925); overflow:hidden; }
    .card-img-wrap::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.35)); pointer-events:none; }
    .gift-img { width:100%; height:100%; object-fit:cover; display:block; }
    .serial-badge { position:absolute; top:8px; right:8px; z-index:2; padding:6px 8px; border-radius:999px; background:rgba(8,13,20,.72); border:1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); font-size:10px; font-weight:800; }
    .source { position:absolute; left:8px; top:8px; z-index:2; padding:6px 8px; border-radius:999px; background:rgba(46,168,255,.15); border:1px solid rgba(46,168,255,.18); color:#bde7ff; font-size:10px; }
    .card-body { padding:10px; }
    .name { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .name strong { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .price { font-size:15px; font-weight:900; white-space:nowrap; }
    .meta { margin-top:5px; color:var(--muted); font-size:10px; line-height:1.4; min-height:28px; }
    .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:7px; }
    .tag { padding:4px 6px; border-radius:7px; background:rgba(255,255,255,.05); color:#b8c4d2; font-size:9px; }
    .tag.gold { background:rgba(255,203,102,.11); color:#ffdda1; }
    .tag.green { background:rgba(68,212,131,.1); color:#a5efc8; }
    .actions { display:grid; grid-template-columns:1fr auto; gap:6px; margin-top:9px; }
    .action-main,.action-icon { min-height:36px; border-radius:11px; cursor:pointer; }
    .action-main { background:linear-gradient(135deg,var(--blue2),var(--blue)); font-weight:800; font-size:11px; }
    .action-icon { width:36px; background:rgba(255,255,255,.06); font-size:16px; }
    .action-main:active,.action-icon:active { transform:scale(.98); }

    .bottom { position:fixed; left:0; right:0; bottom:0; z-index:9; padding:8px 12px calc(8px + var(--safe-bottom)); background:linear-gradient(180deg,transparent,rgba(10,15,22,.8) 25%,rgba(10,15,22,.98)); backdrop-filter:blur(16px); }
    .bottom-bar { max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px; border-radius:18px; background:rgba(19,28,39,.9); border:1px solid rgba(255,255,255,.08); }
    .nav { border-radius:13px; background:transparent; color:#78879a; min-height:46px; cursor:pointer; font-size:10px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    .nav.active { background:rgba(46,168,255,.1); color:#d8f2ff; }
    .nav .ico { font-size:17px; line-height:1; }

    .empty { grid-column:1 / -1; padding:28px 18px; border:1px dashed rgba(255,255,255,.1); border-radius:18px; color:var(--muted); text-align:center; background:rgba(255,255,255,.025); }
    .error { padding:14px; border-radius:16px; background:rgba(255,107,107,.07); border:1px solid rgba(255,107,107,.16); color:#ffc6c6; font-size:12px; }
    .loading-card { height:330px; border-radius:20px; background:linear-gradient(90deg, rgba(255,255,255,.035) 25%, rgba(255,255,255,.07) 37%, rgba(255,255,255,.035) 63%); background-size:400% 100%; animation:shimmer 1.25s infinite; }
    @keyframes shimmer { 0%{background-position:100% 0}100%{background-position:-100% 0} }

    @media (min-width: 700px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } .stat .v{font-size:22px;} }
    @media (max-width: 390px) { .grid{gap:8px;} .card-body{padding:9px;} .price{font-size:14px;} .name strong{font-size:12px;} }

    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(8px); z-index:20; display:none; align-items:flex-end; }
    .modal-backdrop.show { display:flex; }
    .sheet { width:100%; max-height:88vh; overflow:auto; background:#121b27; border-radius:22px 22px 0 0; border:1px solid rgba(255,255,255,.08); animation:sheetIn .22s ease; padding:16px 14px calc(18px + var(--safe-bottom)); }
    @keyframes sheetIn { from { transform:translateY(20px); opacity:.5 } to { transform:none; opacity:1 } }
    .sheet-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .sheet-title { font-size:16px; font-weight:900; }
    .close { width:34px; height:34px; border-radius:12px; background:rgba(255,255,255,.06); cursor:pointer; }
    .sheet-grid { display:grid; grid-template-columns:120px 1fr; gap:12px; margin-top:12px; }
    .sheet-img { width:120px; aspect-ratio:1; border-radius:18px; object-fit:cover; background:#17243a; }
    .kv { display:grid; gap:8px; }
    .kv-row { display:flex; justify-content:space-between; gap:10px; font-size:11px; padding-bottom:7px; border-bottom:1px solid rgba(255,255,255,.05); }
    .kv-row span:first-child{color:var(--muted)}
    .big-open { width:100%; min-height:46px; margin-top:13px; background:linear-gradient(135deg,var(--blue2),var(--blue)); border-radius:14px; font-weight:900; cursor:pointer; }
    .tiny { margin-top:8px; color:var(--muted); font-size:10px; line-height:1.35; }
  </style>
</head>
<body>
<div class="ambient"></div>
<div class="app"><div class="content">
  <header class="hero">
    <div class="brand">
      <div class="radar-logo"></div>
      <div><div class="title">GiftRadar</div><div class="subtitle">Сканер сделок и номеров</div></div>
    </div>
    <div class="live-pill"><span class="dot"></span><span id="liveLabel">LIVE</span></div>
  </header>

  <div class="search">
    <input id="searchInput" placeholder="Подарок, модель или номер…" autocomplete="off" />
    <button id="refreshBtn" class="icon-btn" aria-label="Обновить">↻</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="statCount">—</div><div class="l">найдено</div></div>
    <div class="stat"><div class="v" id="statDeals">—</div><div class="l">сделок в выборке</div></div>
    <div class="stat"><div class="v" id="statSerial">—</div><div class="l">интересных номеров</div></div>
  </div>

  <div class="controls" id="chips">
    <button class="chip active" data-mode="deals">🔥 Сделки</button>
    <button class="chip" data-mode="serial"># Редкие номера</button>
    <button class="chip" data-mode="cheap">💎 Дёшево</button>
    <button class="chip" data-mode="latest">⚡ Новые</button>
    <button class="chip" data-mode="favorites">★ Избранное</button>
  </div>

  <div class="hint">ℹ️ GiftRadar не продаёт подарки и не принимает деньги. Кнопка «Открыть» ведёт в исходный рынок/карточку, а GiftRadar только собирает и сортирует найденные объявления.</div>

  <div class="section-head"><h2 id="sectionTitle">Лучшие сигналы</h2><span id="updatedAt">обновление…</span></div>
  <div id="grid" class="grid"></div>
</div></div>

<div class="bottom"><div class="bottom-bar">
  <button class="nav active" data-nav="deals"><span class="ico">◈</span>Сделки</button>
  <button class="nav" data-nav="serial"><span class="ico">#</span>Номера</button>
  <button class="nav" data-nav="favorites"><span class="ico">★</span>Избранное</button>
  <button class="nav" data-nav="info"><span class="ico">i</span>О GiftRadar</button>
</div></div>

<div id="modal" class="modal-backdrop"><div class="sheet">
  <div class="sheet-head"><div class="sheet-title" id="modalTitle">Подарок</div><button class="close" id="modalClose">×</button></div>
  <div id="modalBody"></div>
</div></div>

<script>
(() => {
  // ===== GiftRadar configuration =====
  // После публикации Google Apps Script вставьте сюда URL,
  // который заканчивается на /exec.
  const API_URL = 'PASTE_GOOGLE_APPS_SCRIPT_EXEC_URL_HERE';
  const API_TIMEOUT_MS = 25000;

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    const tp = tg.themeParams || {};
    const root = document.documentElement;
    root.style.setProperty('--bg', tp.bg_color || '#0b1119');
    root.style.setProperty('--panel', tp.secondary_bg_color ? `${tp.secondary_bg_color}cc` : 'rgba(22, 31, 43, .78)');
    root.style.setProperty('--text', tp.text_color || '#f4f7fb');
    root.style.setProperty('--muted', tp.hint_color || '#93a1b3');
    root.style.setProperty('--blue', tp.link_color || '#2ea8ff');
    root.style.setProperty('--blue2', tp.button_color || '#1677ff');
    tg.setHeaderColor(tp.bg_color || '#0b1119');
    tg.setBackgroundColor(tp.bg_color || '#0b1119');
  }

  const state = {
    items: [],
    mode: 'deals',
    search: '',
    favorites: new Set(JSON.parse(localStorage.getItem('giftradar:favs') || '[]')),
    loading: false,
  };

  const els = {
    grid: document.getElementById('grid'),
    search: document.getElementById('searchInput'),
    refresh: document.getElementById('refreshBtn'),
    count: document.getElementById('statCount'),
    deals: document.getElementById('statDeals'),
    serial: document.getElementById('statSerial'),
    updated: document.getElementById('updatedAt'),
    title: document.getElementById('sectionTitle'),
    modal: document.getElementById('modal'),
    modalTitle: document.getElementById('modalTitle'),
    modalBody: document.getElementById('modalBody'),
    modalClose: document.getElementById('modalClose'),
  };

  function saveFavs(){ localStorage.setItem('giftradar:favs', JSON.stringify([...state.favorites])); }
  function money(n){ return Number(n).toLocaleString('ru-RU', {maximumFractionDigits:2}); }
  function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function haptic(type='light'){ try{tg?.HapticFeedback?.impactOccurred(type)}catch{} }

  function filtered(){
    const q = state.search.toLowerCase();
    let a = state.items.filter(x => !q || `${x.name} ${x.model} ${x.symbol} ${x.backdrop} ${x.number}`.toLowerCase().includes(q));
    if(state.mode === 'serial') a = a.filter(x => (x.number_tags || []).length);
    if(state.mode === 'cheap') a = [...a].sort((x,y) => x.price-y.price);
    else if(state.mode === 'latest') a = [...a].sort((x,y) => new Date(y.listed_at||0)-new Date(x.listed_at||0));
    else if(state.mode === 'favorites') a = a.filter(x => state.favorites.has(x.id));
    else a = [...a].sort((x,y) => ((y.deal_score||0)*2 + (y.number_score||0)) - ((x.deal_score||0)*2 + (x.number_score||0)));
    return a;
  }

  function setMode(mode){
    state.mode = mode;
    document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.mode===mode));
    document.querySelectorAll('.nav').forEach(b => b.classList.toggle('active', b.dataset.nav===mode));
    els.title.textContent = mode==='serial' ? 'Интересные номера' : mode==='favorites' ? 'Избранное' : mode==='cheap' ? 'Самые дешёвые' : mode==='latest' ? 'Новые объявления' : 'Лучшие сигналы';
    render(); haptic();
  }

  function card(x, i){
    const fav = state.favorites.has(x.id);
    const tags = [];
    if(x.discount_sample != null && x.discount_sample > .05) tags.push(`<span class="tag green">−${Math.round(x.discount_sample*100)}% к выборке</span>`);
    (x.number_tags || []).slice(0,2).forEach(t => tags.push(`<span class="tag gold">${esc(t)}</span>`));
    (x.rarity_labels || []).slice(0,1).forEach(t => tags.push(`<span class="tag">модель ${esc(t)}</span>`));
    if(!tags.length) tags.push('<span class="tag">живое объявление</span>');
    const img = x.image ? `<img class="gift-img" loading="lazy" referrerpolicy="no-referrer" src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.style.display='none'">` : '';
    const number = x.number != null ? `#${x.number.toLocaleString('ru-RU')}` : '#—';
    return `<article class="card" style="animation-delay:${Math.min(i,12)*22}ms">
      <div class="card-img-wrap">${img}<div class="source">${esc(x.source)}</div><div class="serial-badge">${number}</div></div>
      <div class="card-body">
        <div class="name"><strong>${esc(x.name)}</strong><div class="price">${money(x.price)} ${esc(x.asset)}</div></div>
        <div class="meta">${esc(x.model || 'Без модели')} ${x.symbol ? '· ' + esc(x.symbol) : ''}<br>${x.backdrop ? esc(x.backdrop) : 'фон не указан'}</div>
        <div class="tags">${tags.join('')}</div>
        <div class="actions"><button class="action-main" data-open="${esc(x.id)}">Подробнее</button><button class="action-icon" data-fav="${esc(x.id)}">${fav?'★':'☆'}</button></div>
      </div></article>`;
  }

  function render(){
    const a = filtered();
    els.grid.innerHTML = a.length ? a.map(card).join('') : `<div class="empty">Ничего не найдено.<br><span style="font-size:11px">Попробуйте другой режим или дождитесь следующего обновления.</span></div>`;
    els.grid.querySelectorAll('[data-fav]').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.fav; state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id); saveFavs(); render(); haptic();
    }));
    els.grid.querySelectorAll('[data-open]').forEach(btn => btn.addEventListener('click', () => openItem(btn.dataset.open)));
    els.count.textContent = a.length;
    els.deals.textContent = state.items.filter(x => (x.deal_score||0) >= 15).length;
    els.serial.textContent = state.items.filter(x => (x.number_tags||[]).length).length;
  }

  function openItem(id){
    const x = state.items.find(v => v.id===id); if(!x) return;
    els.modalTitle.textContent = `${x.name} ${x.number != null ? '#'+x.number : ''}`;
    const tags = [...(x.number_tags||[]), ...(x.rarity_labels||[])];
    els.modalBody.innerHTML = `<div class="sheet-grid">
      ${x.image?`<img class="sheet-img" src="${esc(x.image)}" referrerpolicy="no-referrer" alt="">`:'<div class="sheet-img"></div>'}
      <div class="kv">
        <div class="kv-row"><span>Цена</span><b>${money(x.price)} ${esc(x.asset)}</b></div>
        <div class="kv-row"><span>Источник</span><b>${esc(x.source)}</b></div>
        <div class="kv-row"><span>Модель</span><b>${esc(x.model || '—')}</b></div>
        <div class="kv-row"><span>Фон</span><b>${esc(x.backdrop || '—')}</b></div>
        <div class="kv-row"><span>Символ</span><b>${esc(x.symbol || '—')}</b></div>
        <div class="kv-row"><span>Номерной сигнал</span><b>${x.number_score || 0}/100</b></div>
      </div>
    </div>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag gold">${esc(t)}</span>`).join('')}</div>`:''}
    <button class="big-open" id="goMarket">Открыть источник</button>
    <div class="tiny">GiftRadar не является площадкой и не передаёт вашему устройству секретные ключи. Данные могут устаревать; проверяйте цену и наличие непосредственно перед покупкой.</div>`;
    els.modal.classList.add('show');
    document.getElementById('goMarket').onclick = () => {
      haptic('medium');
      const url = x.nft || 'https://marketplace.tonnel.network/';
      try {
        if (url.startsWith('https://t.me/') && tg?.openTelegramLink) tg.openTelegramLink(url);
        else if (tg?.openLink) tg.openLink(url);
        else window.open(url, '_blank');
      } catch { window.open(url, '_blank'); }
    };
  }

  els.modalClose.onclick = () => els.modal.classList.remove('show');
  els.modal.addEventListener('click', e => { if(e.target===els.modal) els.modal.classList.remove('show'); });
  els.search.addEventListener('input', e => { state.search=e.target.value; render(); });
  els.refresh.addEventListener('click', () => load(true));
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelectorAll('.nav').forEach(b => b.addEventListener('click', () => {
    const n=b.dataset.nav; if(n==='info'){ openInfo(); return; } setMode(n);
  }));

  function openInfo(){
    els.modalTitle.textContent='О GiftRadar';
    els.modalBody.innerHTML=`<div style="margin-top:12px;color:#b5c0cf;font-size:12px;line-height:1.55">
      <p style="margin-top:0"><b style="color:#fff">GiftRadar</b> — бесплатный сканер для поиска интересных объявлений Telegram-подарков.</p>
      <p>Сейчас подключён read-only поток Tonnel. Архитектура отделяет источники, поэтому позже можно подключать MRKT, Portals и другие площадки без переделки интерфейса.</p>
      <p>Номерные сигналы вычисляются по самому серийному номеру: низкие, круглые, палиндромы и повторяющиеся цифры. Это не официальный показатель редкости Telegram.</p>
      <p style="margin-bottom:0">Покупка происходит только на исходной площадке. GiftRadar не принимает оплату и не хранит seed-фразы, пароли или коды Telegram.</p>
    </div>`;
    els.modal.classList.add('show');
  }

  function jsonp(url, timeoutMs=API_TIMEOUT_MS){
    return new Promise((resolve, reject) => {
      const cb = '__giftradar_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let timer = null;
      const cleanup = () => {
        if(timer) clearTimeout(timer);
        try{ delete window[cb]; }catch{}
        script.remove();
      };
      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('Google Apps Script не ответил')); };
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + encodeURIComponent(cb);
      timer = setTimeout(() => { cleanup(); reject(new Error('Превышено время ожидания API')); }, timeoutMs);
      document.head.appendChild(script);
    });
  }

  async function load(force=false){
    if(state.loading) return; state.loading=true;
    els.refresh.style.transform='rotate(180deg)';
    if(!state.items.length) els.grid.innerHTML='<div class="loading-card"></div><div class="loading-card"></div>';
    try{
      if(!API_URL || API_URL.includes('PASTE_GOOGLE_APPS_SCRIPT')) throw new Error('Не указан URL Google Apps Script. Откройте index.html и вставьте адрес /exec в API_URL.');
      const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'action=gifts&force=' + (force ? '1' : '0');
      const data = await jsonp(url);
      state.items = Array.isArray(data.items) ? data.items : [];
      els.updated.textContent = data.generated_at ? new Date(data.generated_at*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : '—';
      document.getElementById('liveLabel').textContent = data.error ? 'OFFLINE' : 'LIVE';
      render();
      if(data.error && !state.items.length){ els.grid.innerHTML=`<div class="error">Не удалось получить live-выборку: ${esc(data.error)}<br><br>Проверьте Google Apps Script и внешний источник. Нажмите ↻ через несколько секунд.</div>`; }
    }catch(e){
      els.grid.innerHTML=`<div class="error">Ошибка подключения к GiftRadar API.<br><br>${esc(e.message||e)}</div>`;
    }finally{
      state.loading=false; setTimeout(()=>els.refresh.style.transform='',250);
    }
  }

  load(false);
  setInterval(() => load(false), 45000);
})();
</script>
</body>
</html>
